name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build native executable
        run: >-
          ./mvnw -B -Dnative
          -Dquarkus.native.container-build=true
          -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-21
          package

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: omsknewsnews-native
          path: target/*-runner
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download native executable
        uses: actions/download-artifact@v4
        with:
          name: omsknewsnews-native
          path: dist

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload binary to incoming
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          VERSION="${GITHUB_REF_NAME}"
          SSH="ssh -i $HOME/.ssh/id_deploy -p ${PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          SCP="scp -i $HOME/.ssh/id_deploy -P ${PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          chmod +x dist/*-runner
          $SSH "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p /opt/omsknewsnews/incoming/'${VERSION}'"
          $SCP dist/*-runner "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/omsknewsnews/incoming/${VERSION}/omsknewsnews-runner"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "${PORT}" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/bin/omsknewsnews-deploy '${GITHUB_REF_NAME}'"
