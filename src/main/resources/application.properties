# Prod datasource is not configured here: pass it via environment variables
# QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.flyway.migrate-at-start=true


# Svelte components are compiled as regular components and mounted from web/app/index.js
quarkus.web-bundler.svelte.custom-element=false

# Dev uses the DB from compose-devservices.yml; schema (and data) managed by Flyway
%dev.quarkus.compose.devservices.remove-volumes=false
%dev.quarkus.compose.devservices.ryuk-enabled=false
%dev.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.flyway.migrate-at-start=true